<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Period Tracker - Welcome</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { box-sizing: border-box; }
    * { font-family: 'Quicksand', sans-serif; }
    .font-display { font-family: 'Cormorant Garamond', serif; }
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }
    @keyframes pulse-soft {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-float { animation: float 6s ease-in-out infinite; }
    .animate-float-delayed { animation: float 6s ease-in-out infinite 2s; }
    .animate-pulse-soft { animation: pulse-soft 3s ease-in-out infinite; }
    .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; }
    .btn-primary {
      background: linear-gradient(135deg, #e879a0 0%, #d4547a 100%);
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(212, 84, 122, 0.4);
    }
  </style>
</head>
<body class="h-full bg-gradient-to-br from-rose-50 via-pink-50 to-fuchsia-50 overflow-auto">

  <div class="min-h-full w-full flex flex-col items-center justify-center p-8 relative overflow-hidden">
    <div class="absolute top-10 left-10 w-32 h-32 bg-pink-200 rounded-full opacity-40 blur-2xl animate-pulse-soft"></div>
    <div class="absolute bottom-20 right-10 w-40 h-40 bg-rose-300 rounded-full opacity-30 blur-3xl animate-pulse-soft"></div>
    <div class="absolute top-1/3 right-1/4 text-6xl animate-float opacity-60">🌸</div>
    <div class="absolute bottom-1/3 left-1/5 text-5xl animate-float-delayed opacity-50">🌷</div>

    <div class="relative z-10 text-center animate-fade-in">
      <div class="mb-6">
        <svg class="w-32 h-32 mx-auto" viewBox="0 0 120 120">
          <defs>
            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#f9a8c9" />
              <stop offset="50%" style="stop-color:#e879a0" />
              <stop offset="100%" style="stop-color:#d4547a" />
            </linearGradient>
          </defs>
          <ellipse cx="60" cy="35" rx="18" ry="28" fill="url(#logoGrad)" opacity="0.9" transform="rotate(0 60 60)" />
          <ellipse cx="60" cy="35" rx="18" ry="28" fill="url(#logoGrad)" opacity="0.8" transform="rotate(72 60 60)" />
          <ellipse cx="60" cy="35" rx="18" ry="28" fill="url(#logoGrad)" opacity="0.7" transform="rotate(144 60 60)" />
          <ellipse cx="60" cy="35" rx="18" ry="28" fill="url(#logoGrad)" opacity="0.8" transform="rotate(216 60 60)" />
          <ellipse cx="60" cy="35" rx="18" ry="28" fill="url(#logoGrad)" opacity="0.9" transform="rotate(288 60 60)" />
          <circle cx="60" cy="60" r="16" fill="#fff5f7" />
          <circle cx="60" cy="60" r="10" fill="url(#logoGrad)" />
        </svg>
      </div>
      <h1 class="font-display text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-rose-400 via-pink-500 to-fuchsia-500 mb-3">Cycle Tracker</h1>
      <p class="text-rose-400 text-xl mb-2">Track your cycle with care</p>
      <p class="text-gray-500 text-sm mb-12">Your personal wellness companion</p>
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <a href="/signup" class="btn-primary text-white px-10 py-4 rounded-full text-lg font-semibold shadow-lg inline-block text-center no-underline">Sign Up ✨</a>
        <a href="/login" class="bg-white/50 backdrop-blur border border-pink-200 text-gray-700 px-10 py-4 rounded-full text-lg font-semibold shadow-lg inline-block text-center no-underline hover:bg-white/70 transition-all">Log In 🌷</a>
      </div>
    </div>
  </div>

  <script>
    // Check if user is already logged in
    const token = localStorage.getItem('tracker_token');
    if (token) {
      // Verify token is still valid
      fetch('/api/auth/me', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          window.location.href = '/tracker';
        }
      })
      .catch(() => {
        localStorage.removeItem('tracker_token');
        localStorage.removeItem('tracker_user');
      });
    }
  </script>
</body>
</html>
