<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Period Tracker - Log In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { box-sizing: border-box; }
    * { font-family: 'Quicksand', sans-serif; }
    .font-display { font-family: 'Cormorant Garamond', serif; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse-soft {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; }
    .animate-pulse-soft { animation: pulse-soft 3s ease-in-out infinite; }
    .glass {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .btn-primary {
      background: linear-gradient(135deg, #e879a0 0%, #d4547a 100%);
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(212, 84, 122, 0.4);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    input:focus {
      outline: none;
      border-color: #e879a0;
      box-shadow: 0 0 0 3px rgba(232, 121, 160, 0.2);
    }
  </style>
</head>
<body class="h-full bg-gradient-to-br from-rose-50 via-pink-50 to-fuchsia-50 overflow-auto">

  <div class="absolute top-10 left-10 w-32 h-32 bg-pink-200 rounded-full opacity-40 blur-2xl animate-pulse-soft"></div>
  <div class="absolute bottom-20 right-10 w-40 h-40 bg-rose-300 rounded-full opacity-30 blur-3xl animate-pulse-soft"></div>

  <div class="min-h-full w-full flex items-center justify-center p-8">
    <div class="glass rounded-3xl p-10 max-w-md w-full animate-fade-in">
      <div class="text-center mb-8">
        <div class="text-5xl mb-4">🌷</div>
        <h2 class="font-display text-3xl font-bold text-gray-800 mb-2">Welcome Back</h2>
        <p class="text-gray-500">Log in with your email and password</p>
      </div>

      <!-- Error/Success Message -->
      <div id="message" class="hidden mb-4 p-3 rounded-xl text-sm text-center"></div>

      <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-2" for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="your@email.com" required
            class="w-full px-5 py-4 rounded-2xl border border-pink-200 bg-white/70 text-gray-700 placeholder-gray-400">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600 mb-2" for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Enter your password" required
            class="w-full px-5 py-4 rounded-2xl border border-pink-200 bg-white/70 text-gray-700 placeholder-gray-400"
            onkeydown="if(event.key==='Enter') document.getElementById('login-form').requestSubmit()">
        </div>

        <button type="submit" id="login-btn" class="btn-primary w-full text-white py-4 rounded-2xl text-lg font-semibold mt-6">
          Continue to Dashboard 🌷
        </button>

        <p class="text-center text-sm text-gray-500 mt-4">
          Don't have an account?
          <a href="/signup" class="text-rose-500 hover:text-rose-600 font-medium">Sign Up</a>
        </p>

        <p class="text-center text-xs text-gray-400 mt-2">Your data is stored securely and privately</p>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50">
    <span id="toast-message"></span>
  </div>

  <script>
    // Check if already logged in
    const token = localStorage.getItem('tracker_token');
    if (token) {
      fetch('/api/auth/me', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) window.location.href = '/tracker';
      })
      .catch(() => {});
    }

    function showMessage(text, isError = true) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = `mb-4 p-3 rounded-xl text-sm text-center ${isError ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}`;
      msg.classList.remove('hidden');
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      toastMsg.textContent = message;
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 3000);
    }

    async function handleLogin(e) {
      e.preventDefault();

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');

      if (!email || !password) {
        showMessage('Please enter both email and password.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem('tracker_token', data.token);
          localStorage.setItem('tracker_user', JSON.stringify(data.user));
          showMessage(data.message || 'Login successful! Redirecting...', false);
          showToast(`Welcome back, ${data.user.name}! 🌷`);
          setTimeout(() => { window.location.href = '/tracker'; }, 800);
        } else {
          showMessage(data.message || 'Login failed. Please check your credentials.');
        }
      } catch (error) {
        console.error('Login error:', error);
        showMessage('Connection error. Please check your internet and try again.');
      }

      btn.disabled = false;
      btn.textContent = 'Continue to Dashboard 🌷';
    }
  </script>
</body>
</html>
